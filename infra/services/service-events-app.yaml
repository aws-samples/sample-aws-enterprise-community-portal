AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  App stack for events (REAL Lambda + routes + role + rules + alarms).
  One function serves four inputs (Unit 4 NFR Design J4): authenticated HTTP,
  the unauthenticated /event-uploads mint, GroupSoftDeleted, and S3/GuardDuty
  object events.
Parameters:
  Stage: { Type: String, Default: dev }
  RestApiId: { Type: String }
  # The private twin of RestApiId. Same route table, reachable only from
  # inside the VPC through the execute-api interface endpoint.
  PrivateRestApiId: { Type: String }
  RootResourceId: { Type: String }
  EventBusName: { Type: String }
  EventBusArn: { Type: String, Default: '' }
  TableName: { Type: String }
  TableArn: { Type: String, Default: '' }
  IdempotencyTableName: { Type: String }
  IdeasTableName: { Type: String, Default: '' }
  IdeasTableArn: { Type: String, Default: '' }
  FileShareBucketName: { Type: String, Default: '' }
  FileShareBucketArn: { Type: String, Default: '' }
  LibraryTableName: { Type: String, Default: '' }
  LibraryTableArn: { Type: String, Default: '' }
  LibraryStreamArn: { Type: String, Default: '', Description: "DynamoDB stream ARN of the Content Library table. Feeds the LibraryIndexerFn. Empty disables the indexer (search falls back to the DynamoDB GSI1 walk)." }
  ApiBaseUrl: { Type: String, Default: '' }
  PublicUploadBaseUrl: { Type: String, Default: '' }
  EnableSemanticSearch: { Type: String, Default: 'false' }
  # OpenSearch Serverless (shared portal-search collection). The Content Library
  # search path uses it exactly as the member directory does. The gate is the
  # ENDPOINT being set, NOT EnableSemanticSearch — the collection is always on
  # for members, and the library rides the same collection.
  OpenSearchEndpoint: { Type: String, Default: '' }
  OpenSearchCollectionArn: { Type: String, Default: '' }
  OpsAlarmTopicArn: { Type: String }
  PrivateSubnetIds: { Type: CommaDelimitedList }
  LambdaSecurityGroupId: { Type: String }
  # CMK from the foundation stack for the log group(s) below. Required (no
  # Default): an empty string is not a valid KmsKeyId, so a missing value must
  # fail at deploy time rather than silently produce an unencrypted log group.
  LogsKmsKeyArn: { Type: String }
  # Managed policy from foundation granting DynamoDB-mediated use of the table
  # CMK. Required (no Default): without it every DynamoDB call from these
  # functions fails with a KMS AccessDenied once the key policy's wildcard
  # statement is removed.
  DynamoDbKmsAccessPolicyArn: { Type: String }
  # SQS CMK + its use policy from the Keys stack, for the LibraryIndexer DLQ.
  # Required (no Default), matching every other app stack: an empty KmsMasterKeyId
  # is not valid, and a queue silently falling back to no encryption is exactly
  # what this prevents. root-template always supplies both from the Keys stack.
  SqsKmsKeyArn: { Type: String }
  SqsKmsAccessPolicyArn: { Type: String }
  # Application Signals (Track B). When 'true', the ADOT layer + exec wrapper +
  # managed policy are attached so this service emits APM metrics/traces. Layer
  # ARN is region+runtime specific and supplied by the operator.
  EnableApplicationSignals: { Type: String, Default: 'false', AllowedValues: ['true', 'false'] }
  AppSignalsLayerArn: { Type: String, Default: 'arn:aws:lambda:us-east-1:000000000000:layer:SET_APP_SIGNALS_LAYER_ARN:1' }

Globals:
  Function:
    Runtime: python3.12
    # Raised from 256/15: a 104-occurrence series create and a 1000-row
    # attendance apply both do many small writes in one invocation.
    MemorySize: 512
    Timeout: 60
    Tracing: Active
Conditions:
  AppSignalsEnabled: !Equals [ !Ref EnableApplicationSignals, 'true' ]
  HasBusArn: !Not [ !Equals [ !Ref EventBusArn, '' ] ]
  # Keyed on the Arn (not the Name) so cfn-lint's condition-aware resolution can
  # prove the Ref/Sub below never sees the empty default.
  HasBucket: !Not [ !Equals [ !Ref FileShareBucketArn, '' ] ]
  HasTableArn: !Not [ !Equals [ !Ref TableArn, '' ] ]
  HasIdeasTable: !Not [ !Equals [ !Ref IdeasTableArn, '' ] ]
  HasLibraryTable: !Not [ !Equals [ !Ref LibraryTableArn, '' ] ]
  # OpenSearch-backed library search + stream indexer. Keyed on the endpoint
  # (not EnableSemanticSearch) — see the OpenSearchEndpoint parameter comment.
  HasOpenSearch: !Not [ !Equals [ !Ref OpenSearchEndpoint, '' ] ]
  # The indexer's DynamoDB event source needs BOTH a stream to read and an
  # endpoint to write to.
  HasLibraryStream: !And
    - !Not [ !Equals [ !Ref LibraryStreamArn, '' ] ]
    - !Condition HasOpenSearch
Resources:
  Fn:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "False positive — cfn_nag's SAM transform (cfn-model) drops VpcConfig; this function IS VPC-configured (see VpcConfig below)"
    Properties:
      FunctionName: !Sub "events-${Stage}"
      Handler: app.handler            # REAL handler (replaces mock_handler.handler)
      CodeUri: ../../dist/events.zip
      # Application Signals ADOT layer (Track B) — attached only when enabled.
      Layers: !If [ AppSignalsEnabled, [ !Ref AppSignalsLayerArn ], !Ref "AWS::NoValue" ]
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds: [ !Ref LambdaSecurityGroupId ]
      Environment:
        Variables:
          # Application Signals auto-instrumentation (Track B). Both omitted when
          # disabled so the function starts normally without the ADOT layer.
          AWS_LAMBDA_EXEC_WRAPPER: !If [ AppSignalsEnabled, "/opt/otel-instrument", !Ref "AWS::NoValue" ]
          OTEL_SERVICE_NAME: !If [ AppSignalsEnabled, "events", !Ref "AWS::NoValue" ]
          TABLE_NAME: !Ref TableName
          IDEMPOTENCY_TABLE: !Ref IdempotencyTableName
          # Trust boundary for extract_claims: X-Claims-* internal headers are
          # honored ONLY when the request arrives on the private API (apiId match).
          PRIVATE_API_ID: !Ref PrivateRestApiId
          EVENT_BUS_NAME: !Ref EventBusName
          FILE_SHARE_BUCKET: !Ref FileShareBucketName
          API_BASE_URL: !Ref ApiBaseUrl
          PUBLIC_UPLOAD_BASE_URL: !Ref PublicUploadBaseUrl
          ENABLE_SEMANTIC_SEARCH: !Ref EnableSemanticSearch
          IDEAS_TABLE_NAME: !Ref IdeasTableName
          LIBRARY_TABLE_NAME: !Ref LibraryTableName
          # When set, LibraryService.search queries OpenSearch instead of walking
          # the GSI1 partition. Empty string => fail-soft to the DynamoDB walk.
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
      Policies:
        # Application Signals write access (Track B) — attached only when enabled.
        - !If [ AppSignalsEnabled, "arn:aws:iam::aws:policy/CloudWatchLambdaApplicationSignalsExecutionRolePolicy", !Ref "AWS::NoValue" ]
        # DynamoDB CMK use (see foundation DynamoDbKmsAccessPolicy).
        - !Ref DynamoDbKmsAccessPolicyArn
        - Statement:
            - Sid: OwnTables
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
              Resource:
                - !If [ HasTableArn, !Ref TableArn, !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}" ]
                - !If [ HasTableArn, !Sub "${TableArn}/index/*", !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*" ]
        # Library table permissions (Content Library rework, US-2.20)
        - !If
          - HasLibraryTable
          - Statement:
              - Sid: LibraryTableCrud
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  # Scan is used only by the library-reindex backfill path
                  # (reindex_all bulk-indexes every resource into OpenSearch).
                  - dynamodb:Scan
                Resource:
                  - !Ref LibraryTableArn
                  - !Sub "${LibraryTableArn}/index/*"
          - !Ref AWS::NoValue
        # Ideas table permissions (Event Ideas feature, US-14)
        - !If
          - HasIdeasTable
          - Statement:
              - Sid: IdeasTableCrud
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Ref IdeasTableArn
                  - !Sub "${IdeasTableArn}/index/*"
          - !Ref AWS::NoValue
        - DynamoDBCrudPolicy: { TableName: !Ref IdempotencyTableName }
        - Statement:
            - Sid: PublishDomainEvents
              Effect: Allow
              Action: events:PutEvents
              Resource: !If [ HasBusArn, !Ref EventBusArn, !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventBusName}" ]
        - Statement:
            # PREFIX-SCOPED, not bucket-wide. (SECURITY-06)
            - Sid: EventAndLibraryFilesObjects
              Effect: Allow
              Action: [ s3:PutObject, s3:GetObject, s3:DeleteObject ]
              Resource:
                - !If [ HasBucket, !Sub "${FileShareBucketArn}/events/*", '*' ]
                - !If [ HasBucket, !Sub "${FileShareBucketArn}/library/*", '*' ]
            - Sid: EventAndLibraryFilesList
              Effect: Allow
              Action: s3:ListBucket
              Resource: !If [ HasBucket, !Ref FileShareBucketArn, '*' ]
              Condition:
                StringLike:
                  s3:prefix: [ "events/*", "library/*" ]
        # OpenSearch read for the library search path (query only). The indexer
        # (below) holds its own write grant. aoss has no finer-grained action
        # than APIAccessAll; the data-access policy on the collection scopes it
        # to the portal-search-${Stage}/* indexes.
        - !If
          - HasOpenSearch
          - Statement:
              - Sid: OpenSearchLibrarySearch
                Effect: Allow
                Action: aoss:APIAccessAll
                Resource: !Ref OpenSearchCollectionArn
          - !Ref AWS::NoValue

  # ---- branch 3: Identity & Access group soft-delete (BR-X3) ----------------
  GroupEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "events-group-deleted-${Stage}"
      EventBusName: !Ref EventBusName
      EventPattern:
        detail-type: [ GroupSoftDeleted ]
      State: ENABLED
      Targets:
        - Id: events-group-consumer
          Arn: !GetAtt Fn.Arn
  GroupEventRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Fn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GroupEventRule.Arn

  # ---- Content Library Path 2: ContributionApproved consumer (US-2.24) ------
  ContributionApprovedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "library-contribution-approved-${Stage}"
      EventBusName: !Ref EventBusName
      EventPattern:
        detail-type: [ ContributionApproved ]
      State: ENABLED
      Targets:
        - Id: library-contribution-consumer
          Arn: !GetAtt Fn.Arn
  ContributionApprovedRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Fn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ContributionApprovedRule.Arn

  # ---- branch 4a: S3 object events, PREFIX-FILTERED (finding F3) ------------
  # Covers both events/ and library/ prefixes. Settings' rule carries its own
  # prefix filter so services don't cross-contaminate idempotency records.
  ObjectRule:
    Type: AWS::Events::Rule
    Condition: HasBucket
    Properties:
      Name: !Sub "events-object-events-${Stage}"
      EventPattern:
        source: [ aws.s3 ]
        detail-type:
          - Object Created
          - Object Deleted
        detail:
          bucket:
            name: [ !Ref FileShareBucketName ]
          object:
            key:
              - prefix: "events/"
              - prefix: "library/"
      State: ENABLED
      Targets:
        - Id: events-object-consumer
          Arn: !GetAtt Fn.Arn
  ObjectRulePermission:
    Type: AWS::Lambda::Permission
    Condition: HasBucket
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Fn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ObjectRule.Arn

  # ---- branch 4b: GuardDuty malware scan results (N1) ----------------------
  # Covers both events/ and library/ prefixes (Content Library rework 2026-08-18).
  MalwareScanRule:
    Type: AWS::Events::Rule
    Condition: HasBucket
    Properties:
      Name: !Sub "events-malware-scan-${Stage}"
      EventPattern:
        source: [ aws.guardduty ]
        detail-type:
          - GuardDuty Malware Protection Object Scan Result
        detail:
          s3ObjectDetails:
            objectKey:
              - prefix: "events/"
              - prefix: "library/"
      State: ENABLED
      Targets:
        - Id: events-scan-consumer
          Arn: !GetAtt Fn.Arn
  MalwareScanRulePermission:
    Type: AWS::Lambda::Permission
    Condition: HasBucket
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Fn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MalwareScanRule.Arn

  # ---- Content Library OpenSearch stream indexer (US-2.20 search rework) ----
  # Mirrors MemberIndexerFn: indexes RESOURCE#*/META items into the OpenSearch
  # 'library' index on every write, applying the same Clean/Link visibility rule
  # the sparse GSI1 key encodes. Separate function (same zip, different handler)
  # so a stream backlog never occupies an interactive API container.
  LibraryIndexerFn:
    Type: AWS::Serverless::Function
    Condition: HasLibraryStream
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "False positive — cfn_nag's SAM transform (cfn-model) drops VpcConfig; this function IS VPC-configured (see VpcConfig below)"
    Properties:
      FunctionName: !Sub "events-library-indexer-${Stage}"
      Handler: library_indexer.handler
      CodeUri: ../../dist/events.zip
      # Application Signals ADOT layer (Track B) — attached only when enabled.
      Layers: !If [ AppSignalsEnabled, [ !Ref AppSignalsLayerArn ], !Ref "AWS::NoValue" ]
      Timeout: 60   # OpenSearch writes can take up to ~30s on cold start; 60s headroom
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds: [ !Ref LambdaSecurityGroupId ]
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: !If [ AppSignalsEnabled, "/opt/otel-instrument", !Ref "AWS::NoValue" ]
          OTEL_SERVICE_NAME: !If [ AppSignalsEnabled, "events", !Ref "AWS::NoValue" ]
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
      Policies:
        - !If [ AppSignalsEnabled, "arn:aws:iam::aws:policy/CloudWatchLambdaApplicationSignalsExecutionRolePolicy", !Ref "AWS::NoValue" ]
        # DynamoDB CMK use — the stream records are encrypted with the table CMK.
        - !Ref DynamoDbKmsAccessPolicyArn
        - !Ref SqsKmsAccessPolicyArn
        - Statement:
            - Sid: OpenSearchIndexWrite
              Effect: Allow
              Action: aoss:APIAccessAll
              Resource: !Ref OpenSearchCollectionArn
        - SQSSendMessagePolicy: { QueueName: !GetAtt LibraryIndexerDLQ.QueueName }
      Events:
        LibraryStream:
          Type: DynamoDB
          Properties:
            Stream: !Ref LibraryStreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 100
            MaximumRetryAttempts: 10
            BisectBatchOnFunctionError: true
            DestinationConfig:
              OnFailure: { Destination: !GetAtt LibraryIndexerDLQ.Arn }

  # SSE-KMS with the shared SQS CMK (Keys stack). KmsMasterKeyId (not
  # SqsManagedSseEnabled — mutually exclusive) so Checkov CKV_AWS_27 and cfn_nag
  # W48 pass. Written by the indexer's event-source mapping under its own role.
  LibraryIndexerDLQ:
    Type: AWS::SQS::Queue
    Condition: HasLibraryStream
    Properties:
      KmsMasterKeyId: !Ref SqsKmsKeyArn
      KmsDataKeyReusePeriodSeconds: 86400
      MessageRetentionPeriod: 1209600   # 14 days

  LibraryIndexerDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasLibraryStream
    Properties:
      AlarmDescription: >-
        Library stream records landed in the indexer DLQ — resources are written
        to DynamoDB but not reflected in OpenSearch search results.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [ { Name: QueueName, Value: !GetAtt LibraryIndexerDLQ.QueueName } ]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OpsAlarmTopicArn ]

  LibraryIndexerLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasLibraryStream
    Properties:
      AlarmDescription: >-
        Library indexer is falling behind the stream (>5 min) — search results
        are stale relative to DynamoDB writes.
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions: [ { Name: FunctionName, Value: !Ref LibraryIndexerFn } ]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 300000   # 5 minutes
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OpsAlarmTopicArn ]

  # ---- alarms (P-OBS-1) ----------------------------------------------------
  # Beyond the first two, these cover conditions where the API looks healthy to
  # callers while something is wrong, which is exactly why they need alarms
  # rather than error-rate monitoring.
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [ { Name: FunctionName, Value: !Ref Fn } ]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [ !Ref OpsAlarmTopicArn ]
  ThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [ { Name: FunctionName, Value: !Ref Fn } ]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [ !Ref OpsAlarmTopicArn ]
  PublicUpload4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        Elevated 4xx on the unauthenticated /event-uploads mint — the portal's
        only public write path. A sustained rate means token guessing.
      Namespace: !Sub "CommunityPortal/events-${Stage}"
      MetricName: PublicUpload4xx
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OpsAlarmTopicArn ]
  AuthzFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Sustained 403s — probing, or a regression in the three-layer authz.
      Namespace: !Sub "CommunityPortal/events-${Stage}"
      MetricName: AuthorizationFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 25
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OpsAlarmTopicArn ]
  MalwareDetectedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        A threat reached the community bucket. The material is quarantined and
        hidden, but an operator needs to know rather than only a hidden row.
      Namespace: !Sub "CommunityPortal/events-${Stage}"
      MetricName: MalwareDetected
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OpsAlarmTopicArn ]
  FanOutFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        Point-value reads to Contributions are failing. Pages still render with
        the points tag hidden (by design), so this is invisible to users and must
        be visible operationally.
      Namespace: !Sub "CommunityPortal/events-${Stage}"
      MetricName: ContributionsFanOutFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OpsAlarmTopicArn ]
  LibraryContributionConsumerFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        ContributionApproved events failing to create Library resources.
        Silent to the approver — must be visible operationally.
      Namespace: !Sub "CommunityPortal/events-${Stage}"
      MetricName: LibraryContributionConsumerFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OpsAlarmTopicArn ]

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Fn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*/*"
  # Second permission, for the PRIVATE API. SourceArn pins a permission to a
  # single api id, so the public one above does NOT cover requests arriving
  # through the private API — without this they fail with API Gateway unable to
  # invoke the function.
  PrivateApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Fn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PrivateRestApiId}/*/*"

  # ── Silent-degradation signals ────────────────────────────────────────────
  # Every fail-soft path below logs a warning, substitutes a fallback and returns
  # success, so without these the degradation is invisible: the caller gets a 200
  # containing quietly wrong data. Added after finding 49 unnoticed membership-
  # lookup timeouts in forums over four days.
  #
  # PLAIN-TEXT filter patterns on purpose. get_logger() attaches the JSON
  # formatter only to the logger it names (propagate=False), so modules using
  # logging.getLogger(__name__) emit Lambda's default TEXT format. A JSON
  # { $.message = ... } pattern matches nothing there; a quoted substring matches
  # both formats.
  #
  # Explicit log group because Lambda only auto-creates it on first invocation,
  # so a metric filter cannot attach on a fresh install without it. It also
  # replaces an auto-created group that had NO retention policy at all.
  FnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/events-${Stage}"
      RetentionInDays: 30
      KmsKeyId: !Ref LogsKmsKeyArn
  AuthzDegradationsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FnLogGroup
      # authorisation computed from stale or default data instead of live state
      FilterPattern: '?"designee role lookup failed" ?"settings read failed"'
      MetricTransformations:
        - MetricNamespace: Portal/Events
          MetricName: AuthzDegradations
          MetricValue: '1'
  AuthzDegradationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "authorisation computed from stale or default data instead of live state"
      Namespace: Portal/Events
      MetricName: AuthzDegradations
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # notBreaching: absent data means no calls were attempted, NOT that they
      # succeeded. Without this the alarm sits in INSUFFICIENT_DATA when idle.
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OpsAlarmTopicArn ]
  LostDomainEventsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FnLogGroup
      # a domain event was dropped after its write committed, so downstream projections diverge
      FilterPattern: '?"event publish failed"'
      MetricTransformations:
        - MetricNamespace: Portal/Events
          MetricName: LostDomainEvents
          MetricValue: '1'
  LostDomainEventsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "a domain event was dropped after its write committed, so downstream projections diverge"
      Namespace: Portal/Events
      MetricName: LostDomainEvents
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # notBreaching: absent data means no calls were attempted, NOT that they
      # succeeded. Without this the alarm sits in INSUFFICIENT_DATA when idle.
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OpsAlarmTopicArn ]
  FanOutFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FnLogGroup
      # a cross-service read failed, so the response is missing fields but still returned 200
      FilterPattern: '?"contributions call failed"'
      MetricTransformations:
        - MetricNamespace: Portal/Events
          MetricName: FanOutFailures
          MetricValue: '1'
  FanOutFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "a cross-service read failed, so the response is missing fields but still returned 200"
      Namespace: Portal/Events
      MetricName: FanOutFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # notBreaching: absent data means no calls were attempted, NOT that they
      # succeeded. Without this the alarm sits in INSUFFICIENT_DATA when idle.
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OpsAlarmTopicArn ]

Outputs:
  FunctionArn: { Value: !GetAtt Fn.Arn }
