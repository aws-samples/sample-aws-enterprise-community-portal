AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Community Portal - API Edge stack. Single shared API Gateway (REST) + Cognito
  authorizer + throttling. Full route table is GENERATED from the frozen service
  contracts by infra/tools/gen_api_edge.py (do not hand-edit routes). Each base
  path proxies to <service>-<stage> Lambda; /auth is public; OPTIONS = CORS mock.
  CloudFront + S3 serve the SPA. WAF omitted (AC-1); throttling via usage plan.

Parameters:
  Stage: { Type: String, Default: dev }
  UserPoolArn: { Type: String }
  # The execute-api interface endpoint from the foundation stack. A PRIVATE REST
  # API must name the endpoint it is reachable through.
  ExecuteApiVpcEndpointId: { Type: String }
  # CMK from the foundation stack, used by both access-log groups below. Required
  # (no Default): an empty string is not a valid KmsKeyId, so a missing value must
  # fail at deploy time rather than silently produce an unencrypted log group.
  LogsKmsKeyArn: { Type: String }
  # S3 server-access-log destination from the foundation stack (CKV_AWS_18). Both
  # buckets in this stack deliver their access logs there, alongside
  # FileShareBucket and UserExportBucket which already do. Required (no Default):
  # an empty DestinationBucketName is not valid, so a missing value must fail at
  # deploy time rather than silently produce an unlogged bucket.
  #
  # Foundation owns the destination and its AccessLogBucketPolicy (the
  # logging.s3.amazonaws.com PutObject grant), and Foundation completes before
  # this stack starts, so the grant is guaranteed to exist before S3 validates
  # the LoggingConfiguration below — no cross-stack DependsOn is needed.
  AccessLogBucketName: { Type: String }

Resources:
  # ───────────────────────────────────────────────────────────────────────────
  # API Gateway account-level CloudWatch Logs role (PORTABILITY).
  #
  # Any REST API stage that enables logging — which BOTH stages here do, via
  # AccessLogSetting and MethodSettings (execution metrics/logging) — requires a
  # CloudWatch Logs role ARN configured at the API Gateway ACCOUNT level. That
  # setting is a per-account/per-region SINGLETON and is NOT set in a fresh
  # account, so stage creation fails with:
  #   "CloudWatch Logs role ARN must be set in account settings to enable logging"
  # It only "worked" in the original account because something had set it there
  # once, out of band — exactly the kind of invisible account-bootstrap
  # dependency that makes a template non-portable. Managing it here removes that
  # dependency so the stack stands up in any account.
  #
  # AWS::ApiGateway::Account is a singleton: this PUTs the account's CloudWatch
  # role. Both APIs DependOn it so the account setting exists before either stage
  # is created. Uses the AWS-managed AmazonAPIGatewayPushToCloudWatchLogs policy,
  # which is the role AWS documents for this exact purpose (it needs account-wide
  # logs:* on log groups/streams API Gateway creates on the fly, so the "*"
  # resource scope is inherent, not an oversight).
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: apigateway.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs"

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  Api:
    Type: AWS::Serverless::Api
    # Account-level CloudWatch role must be set before this stage enables logging.
    DependsOn: ApiGatewayAccount
    Properties:
      StageName: !Ref Stage
      TracingEnabled: true
      # MetricsEnabled so Latency and IntegrationLatency are published per API.
      # Added because migrating the fan-out to the private API raised a question
      # that could not be answered: whether the private path is slower than the
      # public one. It matters — the fan-out clients time out at 1500ms and
      # degrade SILENTLY, so a latency regression would show up as quietly
      # missing data, not as an error. Without these metrics there is nothing to
      # compare the two APIs against.
      MethodSettings:
        - { ResourcePath: '/*', HttpMethod: '*', ThrottlingBurstLimit: 200, ThrottlingRateLimit: 100, MetricsEnabled: true }
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        # $context.routeKey is an HTTP API (v2) variable and resolves to "-" on a
        # REST API, so this logged `route:"-"` for every request from the start.
        # REST APIs expose $context.resourcePath (the matched template, e.g.
        # /settings/{proxy+}) and $context.path (the concrete URL). Both are here:
        # the template tells you which integration ran, the path tells you what
        # the caller actually asked for.
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","resource":"$context.resourcePath","path":"$context.path","status":"$context.status","latency":"$context.responseLatency"}'
      DefinitionBody:
        swagger: '2.0'
        info: { title: !Sub "community-portal-${Stage}", version: '1.0' }
        # Fresh-claims-at-the-edge (perf F3): the scheme keeps the name CognitoAuth
        # — every route references it by name, so redefining it here flips them all
        # at once — but it is now a CUSTOM REQUEST Lambda authorizer. It verifies the
        # Cognito ID token AND injects the caller's FRESH claims (role / ledGroupId /
        # member_group_ids, read from the CLAIMS projection) into the request
        # context, so services trust those instead of a stale JWT or a per-request
        # fan-out. TTL=0 => runs every request (no staleness window).
        # Referenced by constructed function ARN (like the integration URIs), so
        # this stack takes no dependency on the identity-access app stack (no cycle);
        # the invoke permission lives with the function (ClaimsAuthorizerApiPermission).
        # FLIP-BACK: restore the previous cognito_user_pools definition of this
        # single block and redeploy — no route changes needed.
        securityDefinitions:
          CognitoAuth:
            type: apiKey
            name: Authorization
            in: header
            x-amazon-apigateway-authtype: custom
            x-amazon-apigateway-authorizer:
              type: request
              identitySource: method.request.header.Authorization
              authorizerResultTtlInSeconds: 0
              authorizerUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:claims-authorizer-${Stage}/invocations"
        # CORS on API Gateway's OWN error responses (401 from the Cognito
        # authorizer, 403, 5xx). Without these the browser blocks the response
        # and the SPA sees an opaque "Failed to fetch" instead of the real
        # status (e.g. an expired session).
        x-amazon-apigateway-gateway-responses:
          DEFAULT_4XX:
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
              gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
          DEFAULT_5XX:
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
              gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        paths:
          /announcements:
            x-amazon-apigateway-any-method:
              produces: [ application/json ]
              security: [ { CognitoAuth: [] } ]
              responses: {}
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:announcements-${Stage}/invocations"
                passthroughBehavior: when_no_match
            options:
              consumes: [ application/json ]
              produces: [ application/json ]
              responses:
                '200':
                  description: CORS preflight
                  headers:
                    Access-Control-Allow-Origin: { type: string }
                    Access-Control-Allow-Headers: { type: string }
                    Access-Control-Allow-Methods: { type: string }
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates: { application/json: '{"statusCode": 200}' }
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                      method.response.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
          /announcements/{proxy+}:
            x-amazon-apigateway-any-method:
              produces: [ application/json ]
              parameters:
                - { name: proxy, in: path, required: true, type: string }
              security: [ { CognitoAuth: [] } ]
              responses: {}
              x-amazon-apigateway-integration:
